<svg xmlns="http://www.w3.org/2000/svg" width="960" height="309" viewBox="0 0 960 309" role="img" aria-label="Luau reactivity benchmark results, lower is faster"><defs><style>text{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.bg{fill:none}.tt{fill:#11181c}.tm{fill:#697177}.tl{fill:#3a4248}.tw{fill:#fff}.grid{stroke:#e6e9ed;stroke-width:1;stroke-dasharray:2 4}.gridkey{stroke:#c3cbd2;stroke-width:1}.zebra{fill:#11181c;opacity:.022}.b{font-weight:700}.b6{font-weight:600}.e{text-anchor:end}.m{text-anchor:middle}.o9{opacity:.9}.o7{opacity:.72}.lnk{text-decoration:none;text-decoration-thickness:.6px;}.lnk:hover{fill:#11181c}.s95{font-size:9.5px}.s93{font-size:9.3px}.s85{font-size:8.5px}.s83{font-size:8.3px}.s11{font-size:11px}.s13{font-size:13px}.s125{font-size:12.5px}.dnfbg{fill:#f6e4e3}.dnfln{stroke:#d99b98;stroke-width:2}.dnf{fill:#9b1c1c;font-weight:700;paint-order:stroke;stroke:#f6e4e3;stroke-width:2.6px;stroke-linejoin:round}.dnfr{fill:url(#dnf);stroke:#d99b98;stroke-width:.8px}@media (prefers-color-scheme:dark){.tt{fill:#e6edf3}.tm{fill:#8b949e}.tl{fill:#c3cbd6}.grid{stroke:#21262d}.gridkey{stroke:#3a434d}.lnk:hover{fill:#e6edf3}.zebra{fill:#fff;opacity:.025}.dnfbg{fill:#2b1517}.dnfln{stroke:#6e2c30}.dnfr{stroke:#6e2c30}.dnf{fill:#ff8e88;stroke:#2b1517}}</style><linearGradient id="capgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="0.86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.18"/></linearGradient><mask id="capfade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#capgrad)"/></mask><pattern id="dnf" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="dnfbg"/><line x1="0" y1="0" x2="0" y2="6" class="dnfln"/></pattern></defs><rect x="0" y="0" width="960" height="309" class="bg"/><line x1="264.4" y1="76" x2="264.4" y2="245.0" class="gridkey"/><line x1="340.8" y1="76" x2="340.8" y2="245.0" class="grid"/><line x1="493.6" y1="76" x2="493.6" y2="245.0" class="grid"/><line x1="646.4" y1="76" x2="646.4" y2="245.0" class="grid"/><line x1="799.2" y1="76" x2="799.2" y2="245.0" class="grid"/><line x1="952.0" y1="76" x2="952.0" y2="245.0" class="grid"/><text x="0" y="24" font-size="23" font-weight="800" class="tt">Luau reactivity benchmark</text><text x="0" y="45" class="tm s125">headless luau 0.746 <tspan class="mono">-O2</tspan> · per-bench process isolation · normalized per row to the fastest (shorter = faster)</text><text x="264.4" y="68" class="tm mono m s95">1×</text><text x="340.8" y="68" class="tm mono m s95">2×</text><text x="493.6" y="68" class="tm mono m s95">4×</text><text x="646.4" y="68" class="tm mono m s95">6×</text><text x="799.2" y="68" class="tm mono m s95">8×</text><text x="952.0" y="68" class="tm mono m s95">10×</text><text x="174" y="68" class="tm e s95">relative time (lower is faster)</text><text x="0" y="92" class="tl b s11" letter-spacing="0.5">OVERALL · GEOMETRIC MEAN</text><text x="952" y="92" class="tm e" font-size="10">over 23 of 23 rows · DNF charged the 8s per-run deadline</text><text x="176" y="119.5" class="tt b e s125"><a href="https://github.com/kohltastrophe/flux" class="lnk" target="_blank"><tspan class="tm">kohltastrophe/</tspan>flux</a><tspan class="tm s85" font-weight="500" dx="5">0.5.2</tspan></text><rect x="188" y="104" width="77.3" height="22" rx="4" fill="#B13065"/><text x="198" y="119.5" class="tw b s125">1.01×</text><text x="176" y="148.5" class="tt b e s125"><a href="https://github.com/centau/vide" class="lnk" target="_blank"><tspan class="tm">centau/</tspan>vide</a><tspan class="tm s85" font-weight="500" dx="5">0.4.1</tspan></text><rect x="188" y="133" width="141.8" height="22" rx="4" fill="#A25100"/><text x="198" y="148.5" class="tw b s125">1.86×</text><text x="176" y="177.5" class="tt b e s125"><a href="https://github.com/littensy/charm" class="lnk" target="_blank"><tspan class="tm">littensy/</tspan>charm</a><tspan class="tm s85" font-weight="500" dx="5">0.11.1</tspan></text><rect x="188" y="162" width="199.0" height="22" rx="4" fill="#008016"/><text x="198" y="177.5" class="tw b s125">2.60×</text><text x="176" y="206.5" class="tt b e s125"><a href="https://github.com/Roblox/signals" class="lnk" target="_blank"><tspan class="tm">roblox/</tspan>signals</a><tspan class="tm s85" font-weight="500" dx="5">0.9.0</tspan></text><rect x="188" y="191" width="210.2" height="22" rx="4" fill="#007CA6"/><text x="198" y="206.5" class="tw b s125">2.75×</text><text x="176" y="235.5" class="tt b e s125"><a href="https://github.com/dphfox/Fusion" class="lnk" target="_blank"><tspan class="tm">elttob/</tspan>fusion</a><tspan class="tm s85" font-weight="500" dx="5">0.3.0</tspan></text><rect x="188" y="220" width="764.0" height="22" rx="4" fill="#6851C3" mask="url(#capfade)"/><text x="198" y="235.5" class="tw b s125">18.51×</text><text x="0" y="270" class="tm s95">Port of <a href="https://github.com/milomg/js-reactivity-benchmark" class="lnk">milomg/js-reactivity-benchmark</a> · normalized per row to the fastest framework (1.0×, shorter = faster) · process-isolated, upstream's warm-ups and fastest-of-N (cellx: mean).</text><text x="0" y="284" class="tm s95">Faded bars exceed 10× (true multiple labeled) · every non-finishing run (DNF) is charged the 8s per-run deadline in the geomean.</text><text x="0" y="298" class="tm s95">Run-to-run noise is about ±10% even with fastest-of-N and several passes, so treat smaller gaps as ties.</text></svg>
