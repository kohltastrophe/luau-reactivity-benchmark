name: CI-CD

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner.yml
      - assemble.py
      - benchmark.py
      - chart.py
      - wally.toml
      - wally.lock
      - adapters/**
      - bench/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/runner.yml
      - assemble.py
      - benchmark.py
      - chart.py
      - wally.toml
      - wally.lock
      - adapters/**
      - bench/**
      - tests/**
  workflow_dispatch:

env:
  LUAU_VERSION: "0.746"
  WALLY_VERSION: "0.3.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install luau
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -o /tmp/luau.zip -d /tmp/luau-bin
          chmod +x /tmp/luau-bin/luau
          sudo mv /tmp/luau-bin/luau /usr/local/bin/luau
          rm -rf /tmp/luau.zip /tmp/luau-bin

      - name: Install wally
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/wally.zip \
            "https://github.com/UpliftGames/wally/releases/download/v${WALLY_VERSION}/wally-v${WALLY_VERSION}-linux.zip"
          unzip -o /tmp/wally.zip -d /tmp/wally-bin
          chmod +x /tmp/wally-bin/wally
          sudo mv /tmp/wally-bin/wally /usr/local/bin/wally
          rm -rf /tmp/wally.zip /tmp/wally-bin
          wally --version

      - name: Run Python pipeline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify correctness
        env:
          BENCH_CAP: "15"
        run: python3 benchmark.py --verify

  benchmark:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install luau
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -o /tmp/luau.zip -d /tmp/luau-bin
          chmod +x /tmp/luau-bin/luau
          sudo mv /tmp/luau-bin/luau /usr/local/bin/luau
          rm -rf /tmp/luau.zip /tmp/luau-bin

      - name: Install wally
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/wally.zip \
            "https://github.com/UpliftGames/wally/releases/download/v${WALLY_VERSION}/wally-v${WALLY_VERSION}-linux.zip"
          unzip -o /tmp/wally.zip -d /tmp/wally-bin
          chmod +x /tmp/wally-bin/wally
          sudo mv /tmp/wally-bin/wally /usr/local/bin/wally
          rm -rf /tmp/wally.zip /tmp/wally-bin
          wally --version

      - name: Run benchmark and render charts
        run: python3 benchmark.py --passes 3

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            chart.svg
            chart-small.svg
            bench/results.json
            bench/memory.json

      - name: Publish charts and data to assets branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin assets 2>/dev/null; then
            if git cat-file -p FETCH_HEAD:chart.svg 2>/dev/null | cmp -s - chart.svg && \
               git cat-file -p FETCH_HEAD:chart-small.svg 2>/dev/null | cmp -s - chart-small.svg && \
               git cat-file -p FETCH_HEAD:results.json 2>/dev/null | cmp -s - bench/results.json && \
               git cat-file -p FETCH_HEAD:memory.json 2>/dev/null | cmp -s - bench/memory.json; then
              echo "All assets unchanged on assets branch; nothing to publish."
              exit 0
            fi
          fi

          blob_main=$(git hash-object -w chart.svg)
          blob_small=$(git hash-object -w chart-small.svg)
          blob_results=$(git hash-object -w bench/results.json)
          blob_memory=$(git hash-object -w bench/memory.json)

          tree=$(printf '100644 blob %s\tchart.svg\n100644 blob %s\tchart-small.svg\n100644 blob %s\tresults.json\n100644 blob %s\tmemory.json\n' \
            "$blob_main" "$blob_small" "$blob_results" "$blob_memory" | git mktree)

          commit=$(git commit-tree "$tree" -m "Update benchmark charts and JSON data")
          git push --force origin "$commit:refs/heads/assets"

          echo "Published chart.svg, chart-small.svg, results.json, and memory.json to assets ($commit)."
